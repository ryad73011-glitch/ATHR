name: Supabase Edge Function Checks

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-functions.yml"
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-functions.yml"

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check changed Edge Functions
        run: |
          deno check supabase/functions/ai-stylist/index.ts
          deno check supabase/functions/create-checkout/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
