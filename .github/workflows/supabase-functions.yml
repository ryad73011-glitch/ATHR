name: Supabase Edge Function checks

on:
  push:
    branches:
      - main
      - "ci/**"
      - "fix/**"
      - "feat/**"
      - "beta/**"
    paths:
      - "supabase/functions/ai-stylist/**"
      - "supabase/functions/wasm-chat/**"
      - "supabase/functions/classify-product-image/**"
      - ".github/workflows/supabase-functions.yml"
  pull_request:
    branches:
      - main
      - "beta/**"
    paths:
      - "supabase/functions/ai-stylist/**"
      - "supabase/functions/wasm-chat/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check AI Edge Functions
        run: |
          deno check supabase/functions/ai-stylist/index.ts
          deno check supabase/functions/wasm-chat/index.ts
          if [ -f supabase/functions/classify-product-image/index.ts ]; then
            deno check supabase/functions/classify-product-image/index.ts
          else
            echo 'Classifier not present on this branch; check will run when added.'
          fi
